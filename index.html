</main><script id="map-data" type="application/json">{"key":"t3","title":"T3 Code · как запрос становится работой агента","intro":"От окна чата до запуска внешнего агента, сохранения истории и состояния файлов. Изучаем организацию работы на зафиксированном снимке проекта.","date":"17.10.2026","repo":"pingdotgg/t3code","commit":"4b1024dafe4766ea7c59546936c21ce0fab8acb3","nodes":{"t3":{"id":"t3","title":"T3 Code","short":"Управляет работой агентов","kind":"core","role":"Центр: приложение управления","plain":"Связывает пользовательский интерфейс, историю работы, файлы проекта и внешние программы-агенты.","example":"Можно открыть чат с телефона, но рабочие файлы и процесс агента остаются в среде сервера.","tech":"README называет T3 agent harness control surface. Сервер Node принимает RPC, организует команды и события; адаптеры обращаются к внешним provider runtime. Собственный нейросетевой движок из этого не следует.","unknown":"Насколько выбранные сценарии работают в конкретной установке со всеми провайдерами.","check":"Проверить отдельный сценарий на выбранном provider и клиенте, сохранив версии.","sources":["about","overview","intent"],"child":"request","status":"Вывод"},"ui":{"id":"ui","title":"Окно чата","short":"Web, desktop, mobile","kind":"env","role":"Интерфейс пользователя","plain":"Собирает ввод и показывает состояние. Общая логика клиентов помогает нескольким интерфейсам разговаривать с сервером.","example":"Нажать «отправить» — значит передать намерение серверу; это ещё не значит, что агент уже закончил работу.","tech":"startThreadTurn создаёт message.dispatch с commandId, threadId, текстом и параметрами доставки. Ветки очереди и управления активным ходом зависят от capabilities.","unknown":"Совпадение поведения всех кнопок и всех клиентов на практике.","check":"Пройти один сценарий в web, desktop и mobile. В этом разборе они не запускались.","sources":["dispatch","overview"],"child":null,"status":"Наблюдение"},"server":{"id":"server","title":"Сервер среды","short":"Владеет рабочим окружением","kind":"core","role":"Подсистема T3","plain":"Принимает обращения клиентов и координирует работу на машине с проектом.","example":"Удалённое окно управляет средой сервера, а не подменяет её своей файловой системой.","tech":"WebSocket/RPC handler передаёт command в ThreadMessageIntake. Документация явно относит Git, provider-процессы, терминалы и файлы к environment сервера.","unknown":"Полнота проверки прав во всех RPC и способах подключения.","check":"Провести отдельный аудит выбранного метода с разными правами доступа.","sources":["overview","ws"],"child":null,"status":"Наблюдение"},"provider":{"id":"provider","title":"Внешний агент","short":"Runtime за адаптером","kind":"env","role":"Среда T3: исполнитель","plain":"Выполняет работу через собственный runtime. T3 разговаривает с ним через адаптер и общий контракт.","example":"Два агента могут поддерживать разные способы остановки, продолжения и управления активным запросом.","tech":"ProviderTurnStartService выбирает session.startTurn или compactThread и передаёт подготовленный текст. Это граница между управлением T3 и внешним исполнением.","unknown":"Какие гарантии даёт конкретная версия каждого внешнего агента.","check":"Читать его контракт и тестировать сценарий с выбранным адаптером; не переносить результат одного провайдера на все.","sources":["about","start"],"child":null,"status":"Наблюдение"},"database":{"id":"database","title":"SQLite","short":"История состояния","kind":"param","role":"Хранилище T3","plain":"Сохраняет события и производные представления состояния, чтобы работа не зависела только от открытого окна.","example":"Чат можно закрыть, а затем снова прочитать сохранённое состояние. Это отличается от сохранения живого процесса агента.","tech":"События, projection, receipt и outbox фиксируются в транзакции. SQLite настроена на WAL и synchronous=NORMAL. Комментарий прямо различает падение приложения и потерю последних commits при сбое ОС или питания.","unknown":"Какие записи переживут конкретный аварийный сбой и как быстро восстановится клиент.","check":"Испытать выбранную точку прерывания на копии тестовых данных.","sources":["sink","transaction","db"],"child":"state","status":"Наблюдение"},"workspace":{"id":"workspace","title":"Файлы проекта","short":"Изменяемое окружение","kind":"env","role":"Среда работы агента","plain":"Здесь находятся результаты действий над кодом. Их состояние нужно согласовывать с историей разговора.","example":"История может говорить, что файл менялся, а файлы на диске уже могли измениться ещё раз вне T3.","tech":"Environment владеет файлами и Git. Checkpoint — отдельный механизм снимка workspace; он не равен событию в SQLite и не фиксирует всю внешнюю среду.","unknown":"Какие сторонние изменения попадут в конкретный снимок и что останется вне его.","check":"Проверить набор файлов и Git-статусы на тестовом проекте перед и после снимка.","sources":["overview","checkpoint"],"child":"files","status":"Наблюдение"},"dispatch":{"id":"dispatch","title":"Команда","short":"Что пользователь просит сделать","kind":"param","role":"Данные намерения","plain":"Описывает действие с идентификатором и нужными параметрами. Команда проходит серверный путь принятия.","example":"Одна и та же повторная отправка с тем же commandId должна соотноситься с уже сохранённым решением.","tech":"message.dispatch содержит commandId, threadId, messageId, текст и dispatchMode. EventSink резервирует receipt; существующий commandId возвращает сохранённый результат.","unknown":"Поведение при каждом сочетании потери соединения и повторной отправки со стороны клиента.","check":"Разорвать соединение в выбранной точке и проверить commandId, receipt и историю.","sources":["dispatch","sink"],"child":null,"status":"Наблюдение"},"orchestrator":{"id":"orchestrator","title":"Оркестратор","short":"Решает, какие события записать","kind":"core","role":"Подсистема решения","plain":"Сопоставляет команду с состоянием беседы и определяет следующий переход.","example":"Запрос во время активной работы может означать очередь или управление текущим ходом — это разные переходы.","tech":"В обзорной документации описаны сериализация команд и решение событий без provider/filesystem work. Внешние действия передаются effect worker после фиксации намерения. Это описание ключевого пути, а не доказательство чистоты каждой строки огромного файла.","unknown":"Полнота инвариантов для всех гонок и комбинаций состояний.","check":"Выбрать один инвариант и проверить соответствующий обработчик и целевой тест.","sources":["intent","dispatch"],"child":null,"status":"Наблюдение"},"sink":{"id":"sink","title":"Фиксация решения","short":"Транзакция и квитанция","kind":"core","role":"Подсистема сохранения","plain":"Сохраняет принятое решение и задания для дальнейших действий совместно.","example":"Квитанция означает «намерение записано». Она не равна «внешний агент всё сделал».","tech":"commitCommand пишет events, обновляет projections, ставит effects в outbox и сохраняет receipt. commitThenPublish выполняет транзакцию и публикует события после commit.","unknown":"Что произошло во внешней программе между выполнением действия и получением подтверждения.","check":"Сопоставить устойчивые идентификаторы и журнал провайдера при контролируемом прерывании. Одна SQLite-транзакция это неизвестное не закрывает.","sources":["sink","transaction","intent"],"child":null,"status":"Наблюдение"},"worker":{"id":"worker","title":"Исполнитель эффектов","short":"Запускает внешние действия","kind":"core","role":"Подсистема исполнения","plain":"Берёт сохранённые задания и выполняет действия: например, запуск хода агента.","example":"Программа сначала записала «нужно запустить», затем отдельный исполнитель действительно делает запуск.","tech":"Ветка provider-turn.start обращается к providerTurnStart.start; результаты внешней работы возвращаются в orchestration через команды и события.","unknown":"Поведение каждого типа эффекта при потере процесса на своей границе исполнения.","check":"Проверять конкретный effect и recovery-путь; нельзя считать всю внешнюю работу автоматически exactly-once.","sources":["worker","intent"],"child":null,"status":"Наблюдение"},"ingest":{"id":"ingest","title":"Приём событий агента","short":"Перевод в события T3","kind":"core","role":"Подсистема обратной связи","plain":"Принимает сообщения внешнего агента и приводит их к внутреннему виду для сохранения и показа.","example":"Кусочек текста, сообщение о файле и завершение хода — разные виды поступающих данных.","tech":"ProviderEventIngestor преобразует message.updated и turn_item.updated в domain events с thread/run/node привязкой. Детали нормализации остаются зависимыми от адаптера.","unknown":"Как обработается каждое необычное или позднее событие конкретного provider.","check":"Воспроизвести последовательность событий адаптера на фиксированной версии.","sources":["ingest"],"child":null,"status":"Наблюдение"},"projection":{"id":"projection","title":"Состояние для клиента","short":"Представление истории","kind":"param","role":"Данные отображения","plain":"Показывает клиенту нужное представление работы, а не заставляет окно заново понимать весь журнал.","example":"После подключения окно получает состояние выбранного thread и дальнейшие обновления.","tech":"EventSink применяет stored events к projection. Shared client-runtime использует subscribeThread и отдельные пути начальной загрузки, resume и применения событий.","unknown":"Согласованность при каждом варианте reconnect, fork и rollback.","check":"Проверить выбранную последовательность сбоев и сравнить восстановленный экран с сохранёнными событиями.","sources":["sink","subscription","overview"],"child":null,"status":"Наблюдение"},"context":{"id":"context","title":"Передача контекста","short":"История для другого запуска","kind":"core","role":"Подсистема подготовки входа","plain":"Выбирает исторические материалы, которые будут переданы агенту как контекст. Архив приложения и реальный вход агента различаются.","example":"В истории можно хранить много событий, а в один вход поместить лишь часть. Сохранить сообщение и реально передать его исполнителю — разные действия.","tech":"historicalMessage принимает некоторые виды turn item; другие возвращают null. selectHistory выбирает целые сообщения по бюджету и сообщает о пропусках. Вложения и native tool/reasoning state не переигрываются как прежнее выполнение.","unknown":"Какая информация окажется существенной для качества следующего ответа.","check":"Сравнить сохранённую историю, фактически доставленный вход и результат на конкретном сценарии.","sources":["historical","select"],"child":"context","status":"Наблюдение"},"filter":{"id":"filter","title":"Преобразование истории","short":"Что становится текстом","kind":"core","role":"Этап передачи контекста","plain":"Не все записи приложения превращаются в сообщения для внешнего агента. Для некоторых типов сохраняется упрощённое текстовое описание.","example":"У file_change в этом преобразовании остаётся имя файла. Это ещё не полный diff файла.","tech":"historicalMessage оставляет текст user/assistant, команду с кодом выхода и output, ошибку, interrupt result, имя изменённого файла, план. Необработанные типы возвращают null.","unknown":"Потеряется ли полезное ограничение в конкретной истории из-за такого отбора.","check":"Построить небольшую историю с известным важным условием и проверить преобразованные сообщения и фактический вход. Это гипотеза для проверки, не найденный сбой T3.","sources":["historical"],"child":null,"status":"Наблюдение"},"budget":{"id":"budget","title":"Бюджет истории","short":"Выбор целых сообщений","kind":"core","role":"Этап передачи контекста","plain":"Ограничивает объём переносимой истории. Приоритеты выбора определены алгоритмом, а не нашим впечатлением о важности текста.","example":"Длинное старое сообщение может не поместиться, даже если содержит важную для человека мысль. Это возможный случай, а не наблюдавшаяся ошибка.","tech":"Пробуются последнее user, последнее assistant, первое user, затем остальные в обратном порядке. Берутся только полностью помещающиеся элементы; итог возвращается в исходном порядке. Цена оценивается по байтам сериализации с накладными расходами.","unknown":"Совпадение формального бюджета с фактическим tokenizer и смысловая достаточность выбранных элементов.","check":"Сохранить рассчитанный бюджет и точный вход; посчитать токены выбранной моделью и проверить сохранение нужного условия.","sources":["select"],"child":null,"status":"Наблюдение"},"delivery":{"id":"delivery","title":"Доставка контекста","short":"pending, injected, inline","kind":"core","role":"Этап передачи контекста","plain":"Различает подготовленную историю и подтверждённый способ её передачи в native thread.","example":"Когда неизвестно, принял ли внешний runtime данные, повторная отправка может создать дубликат. Код поэтому хранит промежуточный статус.","tech":"Перед native injection сохраняется pending; при успехе — injected. Повторный pending в том же nativeThreadId даёт UncertainError. Есть inline-путь и отдельный fresh-thread путь при неопределённой прошлой доставке.","unknown":"Поведение всей цепочки при аварии в конкретный момент передачи.","check":"Прервать процесс между отправкой и записью статуса; проверить новую сессию, фактический вход и отсутствие непреднамеренного повторного действия.","sources":["delivery","fresh","start"],"child":null,"status":"Наблюдение"},"read":{"id":"read","title":"Дочитывание истории","short":"t3_thread_read","kind":"core","role":"Интерфейс к сохранённым данным","plain":"Даёт агенту путь запросить недостающие материалы. Но наличие инструмента не означает, что агент обязательно им воспользуется.","example":"Вместо передачи всего архива можно указать, как дочитать пропущенное. Получится ли полезный ответ, зависит и от поведения исполнителя.","tech":"handoffCoverage описывает activity view, afterPosition и отдельный textOffset для itemId. В показанной text-функции offset применяется к строковому slice; это курсор текста, не token offset модели.","unknown":"Дочитает ли исполнитель нужный материал в интересующем сценарии.","check":"Записать реальные обращения t3_thread_read и сверить прочитанные диапазоны с вопросом.","sources":["select","read"],"child":null,"status":"Наблюдение"},"checkpoint":{"id":"checkpoint","title":"Снимок файлов","short":"Отдельный результат хода","kind":"param","role":"Состояние workspace","plain":"Фиксирует файловое состояние через Git, чтобы можно было сравнивать и восстанавливать. Его успех нужно смотреть отдельно от завершения хода.","example":"Агент завершил ответ, но снимок файлов может иметь статус missing или error.","tech":"CheckpointService выставляет missing для неподходящего Git workspace и error при ошибке capture. CheckpointCaptureService может записать run.status=completed вместе с checkpointId; это не доказательство ready-снимка.","unknown":"Полнота восстановимого состояния в конкретном проекте.","check":"Проверить checkpoint.status, состав файлов и восстановление на отдельной копии проекта.","sources":["checkpoint","capture"],"child":"files","status":"Наблюдение"},"rollback":{"id":"rollback","title":"Откат","short":"Разговор и файлы","kind":"core","role":"Операция согласования","plain":"Должен согласовать историю внешнего агента и выбранный файловый снимок. Эти операции находятся по разные стороны границ.","example":"Вернуть только файлы может быть недостаточно, если агент продолжает опираться на разговор о более поздних изменениях.","tech":"В показанном участке вызывается session.rollbackThread, затем checkpoints.restore. По этой последовательности нельзя заключить единую атомарную транзакцию через runtime и файловую систему.","unknown":"Итог при сбое между этими действиями для выбранного provider.","check":"Воспроизвести прерывание между откатом разговора и восстановлением файлов на тестовом проекте.","sources":["rollback","overview"],"child":null,"status":"Наблюдение"},"recovery":{"id":"recovery","title":"Продолжение после обновления","short":"Новый управляемый ход","kind":"core","role":"Операция восстановления","plain":"Для некоторых прерванных работ может организовать продолжение с сохранёнными данными. Это не тождественно оживлению прежнего процесса.","example":"Записанное намерение продолжить помогает заново начать работу, но старый запущенный процесс не становится от этого бессмертным.","tech":"RestartContinuation проверяет continueThreadsAfterServerUpdate, более новую активность и ограничение цепочки. Весь набор recovery-механизмов шире этого одного выбранного пути.","unknown":"Как будет вести себя конкретный незавершённый инструмент после реального обновления.","check":"Проверить именно этот сценарий с заданной версией адаптера и журналами внешнего действия.","sources":["recovery","intent"],"child":null,"status":"Наблюдение"},"stop":{"id":"stop","title":"Остановка хода","short":"Запрос внешнему runtime","kind":"core","role":"Операция управления","plain":"Передаёт команду прерывания агенту и обрабатывает итог в рамках поддерживаемого протокола.","example":"Кнопка остановки обращается к внешнему исполнителю; время реакции может различаться между провайдерами.","tech":"ProviderTurnControlService обрабатывает активную сессию и вызов interrupt. Возможности и момент подтверждения зависят от provider и текущего состояния.","unknown":"Гарантия прекращения всех порождённых внешних действий.","check":"Испытать выбранный инструмент, дочерние процессы и адаптер, сопоставив UI с фактическим состоянием.","sources":["interrupt","start"],"child":null,"status":"Наблюдение"}},"edges":[{"from":"ui","to":"server","label":"посылает RPC","status":"Вывод","basis":["dispatch","overview","ws"]},{"from":"server","to":"t3","label":"предоставляет исполнение в среде","status":"Вывод","basis":["overview","ws","about","intent"]},{"from":"t3","to":"provider","label":"управляет через адаптер","status":"Вывод","basis":["about","overview","intent","start"]},{"from":"t3","to":"database","label":"сохраняет историю в","status":"Вывод","basis":["about","overview","intent","sink","transaction","db"]},{"from":"provider","to":"workspace","label":"выполняет действия над","status":"Вывод","basis":["about","start","overview","checkpoint"]},{"from":"ui","to":"dispatch","label":"формирует","status":"Вывод","basis":["dispatch","overview","sink"]},{"from":"dispatch","to":"orchestrator","label":"передаёт намерение","status":"Вывод","basis":["dispatch","sink","intent"]},{"from":"orchestrator","to":"sink","label":"передаёт решение","status":"Вывод","basis":["intent","dispatch","sink","transaction"]},{"from":"sink","to":"worker","label":"сохраняет задания для","status":"Вывод","basis":["sink","transaction","intent","worker"]},{"from":"worker","to":"provider","label":"запускает ход","status":"Вывод","basis":["worker","intent","about","start"]},{"from":"provider","to":"ingest","label":"возвращает события","status":"Вывод","basis":["about","start","ingest"]},{"from":"ingest","to":"sink","label":"передаёт нормализованные события","status":"Вывод","basis":["ingest","sink","transaction","intent"]},{"from":"sink","to":"projection","label":"обновляет","status":"Вывод","basis":["sink","transaction","intent","subscription","overview"]},{"from":"projection","to":"ui","label":"передаёт состояние","status":"Вывод","basis":["sink","subscription","overview","dispatch"]},{"from":"sink","to":"database","label":"фиксирует транзакцию","status":"Вывод","basis":["sink","transaction","intent","db"]},{"from":"context","to":"filter","label":"начинает отбор через","status":"Вывод","basis":["historical","select"]},{"from":"filter","to":"budget","label":"передаёт кандидатов","status":"Вывод","basis":["historical","select"]},{"from":"budget","to":"delivery","label":"передаёт отобранное","status":"Вывод","basis":["select","delivery","fresh","start"]},{"from":"delivery","to":"provider","label":"передаёт контекст","status":"Вывод","basis":["delivery","fresh","start","about"]},{"from":"read","to":"database","label":"читает сохранённые данные","status":"Вывод","basis":["select","read","sink","transaction","db"]},{"from":"context","to":"read","label":"указывает путь дочитывания","status":"Вывод","basis":["historical","select","read"]},{"from":"workspace","to":"checkpoint","label":"фиксируется в","status":"Вывод","basis":["overview","checkpoint","capture"]},{"from":"rollback","to":"checkpoint","label":"использует","status":"Вывод","basis":["rollback","overview","checkpoint","capture"]},{"from":"rollback","to":"provider","label":"согласует разговор","status":"Вывод","basis":["rollback","overview","about","start"]},{"from":"recovery","to":"worker","label":"организует продолжение","status":"Вывод","basis":["recovery","intent","worker"]},{"from":"stop","to":"provider","label":"запрашивает прерывание","status":"Вывод","basis":["interrupt","start","about"]}],"views":[{"id":"world","title":"Вся система","frame":"Центр — T3 как управляющее приложение. Внешний агент и файлы проекта показаны как окружение; окно чата, сервер и хранилище раскрываем отдельными островами.","scale":"Приложение и его рабочая среда","nodes":["t3","ui","server","provider","database","workspace"],"center":true,"route":null},{"id":"request","title":"Путь запроса","frame":"Центр — один пользовательский запрос. Схема показывает главные границы, а не каждый вызов функций.","scale":"Команда → сохранение → действие → отображение","nodes":["dispatch","orchestrator","sink","worker","provider","ingest","projection","ui"],"center":false,"route":["dispatch","orchestrator","sink","worker","provider","ingest","projection","ui"]},{"id":"state","title":"История и восстановление","frame":"Центр — устойчивое состояние T3. История, квитанция и внешнее действие имеют разные гарантии.","scale":"Хранение и жизненный цикл","nodes":["database","sink","projection","worker","recovery","stop"],"center":true,"route":null},{"id":"context","title":"Что получает агент","frame":"Центр — перенос исторического контекста в другой запуск. Архив, выбранный текст и фактическое чтение не отождествляются.","scale":"Преобразование и доставка информации","nodes":["context","filter","budget","delivery","read","provider"],"center":false,"route":["context","filter","budget","delivery","read","provider"]},{"id":"files","title":"Файлы и откат","frame":"Центр — согласование состояния workspace и разговора с provider. Git-снимок и журнал SQLite различаются.","scale":"Файлы и внешняя сессия","nodes":["workspace","checkpoint","rollback","provider","database"],"center":true,"route":null}],"sources":{"about":{"id":"about","path":"README.md","start":1,"end":21,"sha256":"07301caabab983a6f1a6c1542cdad4c3d528233b7e0fabd6d76b089d7387a44c","url":"https://github.com/pingdotgg/t3code/blob/4b1024dafe4766ea7c59546936c21ce0fab8acb3/README.md#L1-L21","excerpt":"   1 | # T3 Code\n   2 | \n   3 | T3 Code is an \"agent harness control surface\". It enables control of the agents on your machine with a best-in-class mobile app ([iOS](https://apps.apple.com/us/app/t3-code-remote-claude-more/id6787819824), [Android](https://play.google.com/store/apps/details?id=com.t3tools.t3code)), [web app](https://app.t3.codes) and [Electron-based desktop app](https://t3.codes).\n   4 | \n   5 | Works with your subscriptions on Claude Code, Codex, Cursor, Grok Build, OpenCode, and Google Antigravity. If they're set up on your computer, T3 Code can control them.\n   6 | \n   7 | ## \"Wait, what are you selling me?\"\n   8 | \n   9 | Nothing. We built T3 Code because we wanted the best possible development experience with agents. We were inspired by existing solutions like the Codex desktop app, Conductor, Claude Desktop and Cursor Glass, but none met our bar.\n  10 | \n  11 | We wanted something performant, remote-ready, and truly open. If we ever go the wrong direction, we want you to have everything you need to fork and build the editor that you want.\n  12 | \n  13 | ## Installation\n  14 | \n  15 | > [!WARNING]\n  16 | > T3 Code currently supports Codex, Claude, Cursor, Grok Build, OpenCode, and Antigravity. Install and authenticate at least one provider before use:\n  17 | >\n  18 | > - Codex: install [Codex CLI](https://developers.openai.com/codex/cli) and run `codex login`\n  19 | > - Claude: install [Claude Code](https://claude.com/product/claude-code) and run `claude auth login`\n  20 | > - Cursor: install [Cursor CLI](https://cursor.com/cli) and run `agent login`\n  21 | > - Grok Build: install [Grok Build CLI](https://x.ai/cli) and run `grok login`"},"overview":{"id":"overview","path":"docs/internals/overview.md","start":1,"end":19,"sha256":"c55f42d36e535b134e3b1be1fc3ddd3f5315199d6352d2e5078fcc577d78ed68","url":"https://github.com/pingdotgg/t3code/blob/4b1024dafe4766ea7c59546936c21ce0fab8acb3/docs/internals/overview.md#L1-L19","excerpt":"   1 | # Architecture\n   2 | \n   3 | T3 Code keeps execution in the environment that owns the workspace. Web, desktop, and mobile\n   4 | clients control it over authenticated RPC. A remote client must never substitute its own filesystem,\n   5 | provider credentials, or machine state for the environment's. The desktop app bundles a server,\n   6 | but its renderer follows the same boundary.\n   7 | \n   8 | ## Ownership boundaries\n   9 | \n  10 | Provider processes, terminals, Git, and project files belong to the server. Shared connection and\n  11 | domain state belongs in `packages/client-runtime`; clients supply platform services and UI.\n  12 | Keeping that logic shared prevents reconnect and multi-environment behavior from diverging between\n  13 | web and mobile. See [connection runtime](./connection-runtime.md) and\n  14 | [remote environments](./remote.md).\n  15 | \n  16 | The [RPC contract](../../packages/contracts/src/rpc.ts) is the boundary between independently\n  17 | versioned clients and servers. Subscriptions send the state a client needs, so a client viewing one\n  18 | thread does not pay for every thread's history. Authentication of a socket does not authorize every\n  19 | method on it. See [environment auth](./environment-auth.md)."},"intent":{"id":"intent","path":"docs/internals/overview.md","start":53,"end":73,"sha256":"c55f42d36e535b134e3b1be1fc3ddd3f5315199d6352d2e5078fcc577d78ed68","url":"https://github.com/pingdotgg/t3code/blob/4b1024dafe4766ea7c59546936c21ce0fab8acb3/docs/internals/overview.md#L53-L73","excerpt":"  53 | ## Durable intent and side effects\n  54 | \n  55 | The event log is the source of truth for orchestration state. The\n  56 | [v2 orchestrator](../../apps/server/src/orchestration-v2/Orchestrator.ts) serializes commands and\n  57 | decides events without performing provider or filesystem work.\n  58 | [EventSink](../../apps/server/src/orchestration-v2/EventSink.ts) commits events, persisted projections,\n  59 | the accepted command receipt, and outbox effects in one database transaction. Subscribers receive\n  60 | events after that commit. This keeps command retries idempotent and prevents a persisted projection\n  61 | from getting ahead of the event log.\n  62 | \n  63 | The [effect worker](../../apps/server/src/orchestration-v2/EffectWorker.ts) performs side effects\n  64 | after intent has been recorded, then feeds results back into orchestration. A command acknowledgement\n  65 | therefore means the intent committed, not that the provider, checkpoint, or other follow-up work\n  66 | finished. Keep external I/O out of command decisions and the database transaction. Effects tied to\n  67 | a lost provider process cannot simply replay; recovery retires them before admitting new work.\n  68 | \n  69 | Persisted events must remain decodable on replay. Changing a schema affects old environments at\n  70 | startup as well as live RPC traffic. Compatibility work must account for stored history, not just\n  71 | what the newest client sends.\n  72 | \n  73 | ## Turn completion and checkpoints"},"dispatch":{"id":"dispatch","path":"packages/client-runtime/src/operations/commands.ts","start":749,"end":766,"sha256":"0deda596af0a8495479f9cfc60a1859b6c161bb8c484d5dfe128335b4c149bbc","url":"https://github.com/pingdotgg/t3code/blob/4b1024dafe4766ea7c59546936c21ce0fab8acb3/packages/client-runtime/src/operations/commands.ts#L749-L766","excerpt":" 749 |   return yield* dispatch({\n 750 |     type: \"message.dispatch\",\n 751 |     commandId,\n 752 |     createdBy: \"user\",\n 753 |     creationSource: input.creationSource ?? \"web\",\n 754 |     threadId: input.threadId,\n 755 |     messageId: input.message.messageId,\n 756 |     text: input.message.text,\n 757 |     ...(context ? { context } : {}),\n 758 |     attachments,\n 759 |     ...(shouldSendTitleSeed ? { titleSeed: input.titleSeed } : {}),\n 760 |     ...(input.modelSelection === undefined ? {} : { modelSelection: input.modelSelection }),\n 761 |     ...(input.sourceProposedPlan === undefined ? {} : { sourcePlanRef: input.sourceProposedPlan }),\n 762 |     ...(serverResolvesCommandContext && requestedMode !== \"queue\"\n 763 |       ? { deliveryIntent: requestedMode }\n 764 |       : {}),\n 765 |     dispatchMode,\n 766 |   });"},"ws":{"id":"ws","path":"apps/server/src/ws.ts","start":1793,"end":1827,"sha256":"d14832b52e51707a27552d86d2d045848bf8363f5630d7a03f62be835c76f567","url":"https://github.com/pingdotgg/t3code/blob/4b1024dafe4766ea7c59546936c21ce0fab8acb3/apps/server/src/ws.ts#L1793-L1827","excerpt":"1793 |         [ORCHESTRATION_V2_WS_METHODS.dispatchCommand]: (command) =>\n1794 |           Effect.annotateCurrentSpan({\n1795 |             \"orchestration_v2.command_id\": command.commandId,\n1796 |             \"orchestration_v2.command_type\": command.type,\n1797 |             \"orchestration_v2.thread_id\":\n1798 |               command.type === \"thread.fork\" || command.type === \"thread.merge_back\"\n1799 |                 ? command.targetThreadId\n1800 |                 : command.type === \"delegated_task.request\" ||\n1801 |                     command.type === \"delegated_ta function select(id,focus=false){selected=id;draw();setHash();if(focus)document.querySelector('[data-node="'+id+'"]').focus({preventScroll:true});}
function open(id,node){view=id;const v=D.views.find(v=>v.id===id);selected=node&&v.nodes.includes(node)?node:v.nodes[0];draw();setHash();}
function sourceBlock(id){const s=D.sources[id],e=make('div',undefined,'source');e.append(make('p',s.path+' · строки '+s.start+'–'+s.end));const a=make('a','Открыть этот фрагмент на GitHub');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';e.append(a);const z=make('details');z.append(make('summary','Прочитать исходный фрагмент без интернета'));z.append(make('pre',s.excerpt));e.append(z);return e;}
function draw(){const v=D.views.find(v=>v.id===view),n=D.nodes[selected];$('#views').replaceChildren(...D.views.map(x=>{const e=b(x.title,()=>open(x.id));e.setAttribute('aria-pressed',String(x.id===view));return e;}));$('#frame').replaceChildren(make('p',v.frame),make('p','Масштаб: '+v.scale,'hint'));$('#map-heading').textContent=v.title;$('#islands').replaceChildren(...v.nodes.map((id,i)=>{const n=D.nodes[id];const e=b('',()=>select(id,true),'island '+n.kind+(i===0&&v.center?' center':''));e.dataset.node=id;e.setAttribute('aria-pressed',String(selected===id));e.append(make('strong',n.title),make('small',n.short));return e;}));
const panel=$('#detail');panel.replaceChildren(make('div',n.status+' · '+n.role,'label'),make('h2',n.title),make('p',n.plain));const example=make('div',undefined,'example');example.append(make('div','Пример для понимания','hint'),make('p',n.example));panel.append(example);
if(n.child){panel.append(b('Рассмотреть устройство →',()=>open(n.child),'flat drill'));}
const relations=D.edges.filter(r=>r.from===selected||r.to===selected);if(relations.length){const r=make('div',undefined,'links');r.append(make('h3','С чем связано'));const ul=make('ul');for(const edge of relations){const li=make('li');li.append(make('span',D.nodes[edge.from].title+' → '+edge.label+' → '+D.nodes[edge.to].title+'. '));const dest=edge.to===selected?edge.from:edge.to;li.append(b('Открыть: '+D.nodes[dest].title,()=>{const target=D.views.find(x=>x.nodes.includes(dest));open(v.nodes.includes(dest)?view:target.id,dest);},''));ul.append(li);}r.append(ul);panel.append(r);}
const tech=make('details');tech.append(make('summary','Чуть глубже: что делает код'),make('p',n.tech));panel.append(tech);const u=make('div',undefined,'unknown');u.append(make('div','Неизвестно в этом разборе','label'),make('p',n.unknown),make('p','Как узнать: '+n.check,'hint'));panel.append(u);const refs=make('details');refs.append(make('summary','Источники · '+n.sources.length));for(const id of n.sources)refs.append(sourceBlock(id));panel.append(refs);
$('#route').replaceChildren();if(v.route){const ix=v.route.indexOf(selected);$('#route').append(b('← Предыдущий',()=>select(v.route[Math.max(0,ix-1)])),make('span','Учебный маршрут '+(Math.max(0,ix)+1)+' / '+v.route.length),b('Следующий →',()=>select(v.route[Math.min(v.route.length-1,Math.max(0,ix)+1)])));$('#route button:first-child').disabled=ix<=0;$('#route button:last-child').disabled=ix===v.route.length-1;}
requestAnimationFrame(wires);}
function wires(){
const box=$('#map-area').getBoundingClientRect(),svg=$('#wires');svg.replaceChildren();svg.setAttribute('viewBox','0 0 '+box.width+' '+box.height);const ns='http://www.w3.org/2000/svg';const defs=document.createElementNS(ns,'defs'),marker=document.createElementNS(ns,'marker');marker.setAttribute('id','arrow');marker.setAttribute('markerWidth','8');marker.setAttribute('markerHeight','8');marker.setAttribute('refX','7');marker.setAttribute('refY','4');marker.setAttribute('orient','auto');const arr=document.createElementNS(ns,'path');arr.setAttribute('d','M0 0 L8 4 L0 8 Z');arr.setAttribute('fill','var(--green)');marker.append(arr);defs.append(marker);svg.append(defs);
const rects=[...document.querySelectorAll('[data-node]')].map(e=>{const r=e.getBoundingClientRect();return {id:e.dataset.node,l:r.left-box.left,r:r.right-box.left,t:r.top-box.top,b:r.bottom-box.top};});
const ports=r=>[[r.l-8,(r.t+r.b)/2],[r.r+8,(r.t+r.b)/2],[(r.l+r.r)/2,r.t-8],[(r.l+r.r)/2,r.b+8]];
const lanesX=[-4,box.width+4,...rects.flatMap(r=>[r.l-10,r.r+10])],lanesY=[0,box.height,...rects.flatMap(r=>[r.t-10,r.b+10])];
function clear(a,b){if(Math.abs(a[0]-b[0])>.1&&Math.abs(a[1]-b[1])>.1)return false;return !rects.some(r=>Math.abs(a[0]-b[0])<.1?a[0]>r.l-4&&a[0]<r.r+4&&Math.max(a[1],b[1])>r.t-4&&Math.min(a[1],b[1])<r.b+4:a[1]>r.t-4&&a[1]<r.b+4&&Math.max(a[0],b[0])>r.l-4&&Math.min(a[0],b[0])<r.r+4);}
for(const r of D.edges.filter(r=>r.from===selected||r.to===selected)){const from=rects.find(x=>x.id===r.from),to=rects.find(x=>x.id===r.to);if(!from||!to)continue;let best=null,cost=Infinity;for(const a of ports(from))for(const b of ports(to)){const paths=[[a,[a[0],b[1]],b],[a,[b[0],a[1]],b],...lanesX.map(x=>[a,[x,a[1]],[x,b[1]],b]),...lanesY.map(y=>[a,[a[0],y],[b[0],y],b])];for(let points of paths){points=points.filter((p,i)=>!i||Math.abs(p[0]-points[i-1][0])+Math.abs(p[1]-points[i-1][1])>.1);if(points.slice(1).some((p,i)=>!clear(points[i],p)))continue;const length=points.slice(1).reduce((s,p,i)=>s+Math.abs(p[0]-points[i][0])+Math.abs(p[1]-points[i][1]),0)+points.length*10;if(length<cost){cost=length;best=points;}}}if(!best)continue;const p=document.createElementNS(ns,'path');p.dataset.edge=r.from+'/'+r.to;p.setAttribute('d',best.map((a,i)=>(i?'L ':'M ')+a.join(' ')).join(' '));p.setAttribute('fill','none');p.setAttribute('stroke','var(--green)');p.setAttribute('stroke-width','1.3');p.setAttribute('opacity','.65');p.setAttribute('marker-end','url(#arrow)');svg.append(p);}}
$('#title').textContent=D.title;$('#intro').textContent=D.intro;$('#meta').textContent='Снимок '+D.date+' · '+D.repo+' · commit '+D.commit.slice(0,12)+' · чтение кода, без запуска модели';$('#guide').replaceChildren(...D.guide.map(t=>make('li',t)));$('#lesson').textContent=D.lesson;$('#method').replaceChildren(...D.method.map(t=>make('p',t)));$('#footer').textContent='Карта работает без сети. Внешние ссылки ведут на зафиксированную версию исходников. Исходные проекты и модели здесь не запускаются. Автор учебного разбора: Codex, при участии пользователя; это не документация авторов проекта.';
if(D.credits){const c=$('#credits');c.hidden=false;const heading=make('h2','Авторство и источники');heading.id='credits-heading';c.append(heading);for(const text of D.credits.paragraphs)c.append(make('p',text));const link=make('a','Исходный проект T3 Code на GitHub');link.href=D.credits.projectUrl;link.target='_blank';link.rel='noopener noreferrer';c.append(link);const license=make('details');license.id='source-license';license.append(make('summary','Лицензия исходного кода: MIT · полный текст'),make('pre',D.credits.licenseText));c.append(license);$('#footer').textContent='Карта работает без сети. Внешние ссылки ведут на публичные исходники. Дата снимка и границы исследования указаны выше. При распространении карты сохраняйте блок авторства и текст лицензии исходного кода.';}
$('#query').addEventListener('input',()=>{const q=$('#query').value.trim().toLowerCase();const matches=q?Object.values(D.nodes).filter(n=>(n.title+' '+n.short+' '+n.plain+' '+n.tech).toLowerCase().includes(q)):[];$('#results').replaceChildren(...matches.map(n=>b(n.title,()=>{const v=D.views.find(v=>v.nodes.includes(n.id));open(v.id,n.id);$('#detail').scrollIntoView({block:'start'});})));if(q&&!matches.length)$('#results').textContent='Совпадений нет.';});
function fromHash(){const [v,n]=location.hash.slice(1).split('/');if(D.views.some(x=>x.id===v&&x.nodes.includes(n))){view=v;selected=n;}draw();}window.addEventListener('hashchange',fromHash);new ResizeObserver(wires).observe($('#map-area'));fromHash();
})();</script></body></html>
